name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install markdown pytest
      - name: Rodar testes (build + segurança)
        run: python -m pytest -q
      - name: Gerar todos os builds (regenerável)
        run: |
          python src/build.py config.py
          python src/build.py site/config.site.py
          python src/build.py examples/landing/config.landing.py
          python src/build.py examples/recursos/config.recursos.py
          python src/build.py examples/demo/config.demo.py
          python src/build.py examples/blog/config.blog.py
          for t in examples/templates/startup examples/templates/produto examples/templates/evento examples/templates/docs examples/templates/contato examples/templates/blog examples/templates/bio examples/templates/landingpage; do
            python src/build.py "$t/config.py"
          done

  build-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependência
        run: pip install markdown
      - name: Gerar todas as páginas (doc + landing + exemplos + templates)
        run: |
          python src/build.py config.py
          python src/build.py site/config.site.py
          python src/build.py examples/landing/config.landing.py
          python src/build.py examples/recursos/config.recursos.py
          python src/build.py examples/demo/config.demo.py
          python src/build.py examples/blog/config.blog.py
          for t in examples/templates/startup examples/templates/produto examples/templates/evento examples/templates/docs examples/templates/contato examples/templates/blog examples/templates/bio examples/templates/landingpage; do
            python src/build.py "$t/config.py"
          done
      - name: Montar _site completo (home + doc + exemplos + auxiliares)
        run: python scripts/deploy_pages.py site/config.site.py
      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
