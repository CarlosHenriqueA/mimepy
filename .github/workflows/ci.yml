name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependência
        run: pip install markdown pytest
      - name: Rodar testes (build + segurança)
        run: python -m pytest -q
      - name: Gerar builds de exemplo
        run: |
          python src/build.py config.py
          python src/build.py site/config.site.py

  build-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependência
        run: pip install markdown
      - name: Gerar landing do site
        run: python src/build.py site/config.site.py
      - name: Preparar artefato (site + doc)
        run: |
          mkdir -p _site
          cp -r site/out/index.html _site/index.html 2>/dev/null || cp site/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
